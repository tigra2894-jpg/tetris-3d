name: Build APK

on:
  push:
    branches: [ main, 'devin/**', 'claude/**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ia codul
        uses: actions/checkout@v4

      - name: Pune Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Pregateste Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Construieste APK-urile
        run: ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Redenumeste APK-urile
        run: |
          cp app/build/outputs/apk/release/app-release.apk Tetris3DPro.apk
          cp app/build/outputs/apk/debug/app-debug.apk Tetris3DPro-debug.apk

      - name: Urca APK-urile ca artefact
        uses: actions/upload-artifact@v4
        with:
          name: Tetris3DPro-apk
          path: |
            Tetris3DPro.apk
            Tetris3DPro-debug.apk
          if-no-files-found: error

      - name: Publica release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Tetris 3D Pro v2.0.${{ github.run_number }}
          body: |
            APK generat automat din commit ${{ github.sha }}.
            Descarca **Tetris3DPro.apk** si instaleaza-l pe telefon.
          files: |
            Tetris3DPro.apk
            Tetris3DPro-debug.apk
